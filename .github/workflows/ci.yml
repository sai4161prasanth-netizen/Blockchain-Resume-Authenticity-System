name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            blockchain/package-lock.json

      - name: Install and verify client
        run: |
          npm ci --prefix client
          npm audit --prefix client
          npm run lint --prefix client
          npm run build --prefix client

      - name: Install and verify API
        run: |
          npm ci --prefix server
          npm audit --prefix server
          node --check server/index.js
          node --check server/routes/aiRoutes.js
          node --check server/routes/certRoutes.js
          node --check server/routes/authRoutes.js

      - name: Install and verify contract
        run: |
          npm ci --prefix blockchain
          npm audit --prefix blockchain
          npm run compile --prefix blockchain
